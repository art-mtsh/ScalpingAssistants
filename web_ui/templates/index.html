<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sizes Monitor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="topbar">
  <h1><span class="brand-icon">📈</span> Sizes Monitor</h1>
  <div class="controls">
    <input id="search" type="text" placeholder="Coin search..." autocomplete="off">
    <span class="status-line" id="rowCount"></span>
    <span class="status-line" id="lastUpdate"></span>
    <a class="nav-btn" href="{{ url_for('coins_page') }}">Coins</a>
    <button class="theme-toggle" id="themeToggle">🌙 / ☀️</button>
  </div>
</div>

<div class="error-banner" id="errorBanner"></div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Coin</th>
        <th>Dom</th>
        <th>Chart</th>
        <th>Price</th>
        <th>Distance</th>
        <th>Size/Dom</th>
        <th>Size/Avg</th>
        <th>First signal</th>
        <th>Last fixation</th>
        <th>Count (Total)</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="12" class="empty">Завантаження...</td></tr>
    </tbody>
  </table>
</div>

<script>
  // Значення за замовчуванням з бекенду (envs/params.env), може бути перезаписане API-відповіддю
  window.REPEAT_COUNTER_DEFAULT = {{ repeat_counter }};
</script>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
